<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWEB1 — Cap. 05 — AT03 — Semana de Tecnologia IFAL - Inscrição</title>
</head>
<body>
    <header>
        <h1>Semana de Tecnologia IFAL - Inscrição</h1>
        <p><a href="../index.html">← Voltar à página principal</a></p>
    </header>
    <main>
        <form action="https://httpbin.org/post" method="post" enctype="multipart/form-data">

            <input type="hidden" name="edicao" value="2026">

            <fieldset>
            <legend>Identificação do Participante</legend>

            <div>
                <label for="nome">Nome completo *</label><br>
                <input type="text" id="nome" name="nome" required>
            </div>

            <br>

            <div>
                <label for="email">E-mail institucional *</label><br>
                <input type="email" id="email" name="email" required>
            </div>

            <br>

            <div>
                <label for="cidade">Cidade de origem</label><br>
                <input type="text" id="cidade" name="cidade" list="cidades">

                <datalist id="cidades">
                <option value="Maceió">
                <option value="Arapiraca">
                <option value="Palmeira dos Índios">
                <option value="Rio Largo">
                <option value="Penedo">
                <option value="União dos Palmares">
                <option value="São Miguel dos Campos">
                <option value="Delmiro Gouveia">
                </datalist>
            </div>

            <br>

            <div>
                <label for="foto">Foto para crachá</label><br>
                <input type="file" id="foto" name="foto"
                    accept="image/jpeg,image/png"
                    aria-describedby="ajuda-foto">

                <br>
                <small id="ajuda-foto">
                Formatos aceitos: JPG e PNG. Tamanho máximo: 2 MB.
                </small>
            </div>

            </fieldset>

            <br>

            <fieldset>
            <legend>Preferências para o Evento</legend>

            <div>
                <label for="chegada">Data e hora de chegada</label><br>
                <input type="datetime-local" id="chegada" name="chegada">
            </div>

            <br>

            <div>
                <label for="experiencia">
                Nível de experiência: <span id="valor-experiencia">5</span>/10
                </label><br>

                <input
                type="range"
                id="experiencia"
                name="experiencia"
                min="0"
                max="10"
                step="1"
                value="5"
                oninput="document.getElementById('valor-experiencia').textContent = this.value">
            </div>

            <br>

            <div>
                <label for="cor_camiseta">Cor da camiseta</label><br>
                <input type="color" id="cor_camiseta" name="cor_camiseta" value="#1a73e8">
            </div>

            <br>

            <div>
                <label for="oficinas">Oficinas de interesse</label><br>

                <select id="oficinas" name="oficinas[]" multiple size="4"
                        aria-describedby="ajuda-oficinas">
                <option value="web">Desenvolvimento Web</option>
                <option value="bd">Banco de Dados</option>
                <option value="ia">Inteligência Artificial</option>
                <option value="seguranca">Segurança da Informação</option>
                <option value="mobile">Desenvolvimento Mobile</option>
                </select>

                <br>
                <small id="ajuda-oficinas">
                Use Ctrl (ou Cmd no Mac) para selecionar mais de uma oficina.
                </small>
            </div>

            </fieldset>

            <br>

            <button type="submit">Confirmar inscrição</button>

        </form>
    </main>
</body>
</html>
