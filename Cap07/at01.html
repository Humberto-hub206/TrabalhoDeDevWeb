<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>PWEB1 — Cap. 07 — AT01 — Cartão de Apresentação</title>

  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      background-color: #dfe6e9;
      text-align: center;
    }

    .cartao {
      background-color: #ffffff;
      border-radius: 12px;
      padding: 2rem;
      width: 350px;
      margin: 40px auto;
    }

    .cartao-nome {
      font-size: 2.2rem;
      color: #2d3436;
      font-weight: bold;
    }

    hr {
      border: 2px dashed #0984e3;
      width: 80%;
    }

    .cartao-divisor {
      margin: 1.5rem auto;
    }

    .cartao-cargo {
      font-style: italic;
      color: #636e72;
      font-size: 1.1rem;
    }

    .cartao-email {
      font-size: 0.9rem;
      color: #2d3436;
    }
  </style>
</head>

<body>

  <header>
    <h1>AT01 — Cartão de Apresentação</h1>

    <p>
      <a href="../index.html">
        ← Voltar para a página principal
      </a>
    </p>
  </header>

  <main>
    <article class="cartao">

      <h1 class="cartao-nome">
        José Humberto
      </h1>

      <hr class="cartao-divisor" />

      <p class="cartao-cargo">
        Estudante de Sistemas de Informação — IFAL
      </p>

      <p class="cartao-email">
        jose@email.com
      </p>

    </article>
  </main>

</body>
</html>
